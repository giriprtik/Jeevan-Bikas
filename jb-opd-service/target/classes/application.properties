spring.application.name=jb-opd-service
server.port=${SERVER_PORT:8082}
app.hospital.name=Jeevan Bikas Hospital

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5455/opd_clinical_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:opd_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:opd_secure_password}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
app.internal-secret=${INTERNAL_SERVICES_SECRET}
auth.service.url=${AUTH_SERVICE_URL:http://jb-auth-api:8081}
lab.service.url=${LAB_SERVICE_URL:http://jb-lab-service:8083}

logging.level.root=INFO
logging.level.com.hospital=INFO
