spring.application.name=jb-lab-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5456/lab_clinical_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lab_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lab_secure_password}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}

logging.level.root=INFO
logging.level.com.hospital=INFO
