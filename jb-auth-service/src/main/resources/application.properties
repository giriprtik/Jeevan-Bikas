spring.application.name=jb-auth-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/auth_records_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auth_secure_password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}
app.internal-secret=${INTERNAL_SERVICES_SECRET}
app.seed.demo-users=${APP_SEED_DEMO_USERS:true}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:Demo@1234}

logging.level.root=INFO
logging.level.com.hospital=INFO
