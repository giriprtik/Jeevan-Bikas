# Jeevan Bikas Hospital: OPD + Lab microservices
#   docker compose up --build      ->  UI on http://localhost:3000, API gateway on http://localhost:8080
# Secrets come from .env (see .env.example); the defaults below are for local demos only.

x-jwt: &jwt
  APP_JWT_SECRET: ${APP_JWT_SECRET:-dGhpcy1pcy1hLXN1cGVyLXNlY3VyZS1hbmQtbG9uZy1zZWNyZXQta2V5LWZvci1qc29uLXdlYi10b2tlbnM=}

x-internal: &internal
  INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-3e7c8a9f2b4d6e8a1c3f5b7d9e0a2c4e6f8b0d2e4f6a8c0b2d4e6f8a0c2b4d6e}

services:
  # ---------------------------------------------------------------- databases (one per service)
  auth-postgres-db:
    image: postgres:15-alpine
    container_name: hospital-auth-db
    ports: ["5431:5432"]
    environment:
      POSTGRES_DB: auth_records_db
      POSTGRES_USER: auth_admin
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secure_password}
    volumes: [auth_db_data:/var/lib/postgresql/data]
    networks: [jb-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_admin -d auth_records_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  opd-postgres-db:
    image: postgres:15-alpine
    container_name: hospital-opd-db
    ports: ["5455:5432"]
    environment:
      POSTGRES_DB: opd_clinical_db
      POSTGRES_USER: opd_admin
      POSTGRES_PASSWORD: ${OPD_DB_PASSWORD:-opd_secure_password}
    volumes: [opd_db_data:/var/lib/postgresql/data]
    networks: [jb-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opd_admin -d opd_clinical_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  lab-postgres-db:
    image: postgres:15-alpine
    container_name: hospital-lab-db
    ports: ["5456:5432"]
    environment:
      POSTGRES_DB: lab_clinical_db
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab_secure_password}
    volumes: [lab_db_data:/var/lib/postgresql/data]
    networks: [jb-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d lab_clinical_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- services
  jb-auth-api:
    build: ./jb-auth-service
    container_name: jb-auth-service
    expose: ["8081"]
    depends_on:
      auth-postgres-db: { condition: service_healthy }
    environment:
      <<: [*jwt, *internal]
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-28800000}   # 8-hour shift
      APP_SEED_DEMO_USERS: ${APP_SEED_DEMO_USERS:-true}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-Demo@1234}
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres-db:5432/auth_records_db
      SPRING_DATASOURCE_USERNAME: auth_admin
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secure_password}
    networks: [jb-network]
    restart: unless-stopped

  jb-opd-service:
    build: ./jb-opd-service
    container_name: jb-opd-service
    expose: ["8082"]
    depends_on:
      opd-postgres-db: { condition: service_healthy }
      jb-auth-api: { condition: service_started }
    environment:
      <<: [*jwt, *internal]
      SPRING_DATASOURCE_URL: jdbc:postgresql://opd-postgres-db:5432/opd_clinical_db
      SPRING_DATASOURCE_USERNAME: opd_admin
      SPRING_DATASOURCE_PASSWORD: ${OPD_DB_PASSWORD:-opd_secure_password}
      AUTH_SERVICE_URL: http://jb-auth-api:8081
      LAB_SERVICE_URL: http://jb-lab-service:8083
    networks: [jb-network]
    restart: unless-stopped

  jb-lab-service:
    build: ./jb-lab-service
    container_name: jb-lab-service
    expose: ["8083"]
    depends_on:
      lab-postgres-db: { condition: service_healthy }
    environment:
      <<: *jwt
      SPRING_DATASOURCE_URL: jdbc:postgresql://lab-postgres-db:5432/lab_clinical_db
      SPRING_DATASOURCE_USERNAME: lab_admin
      SPRING_DATASOURCE_PASSWORD: ${LAB_DB_PASSWORD:-lab_secure_password}
    networks: [jb-network]
    restart: unless-stopped

  jb-gateway:
    build: ./jb-gateway
    container_name: jb-gateway
    ports: ["8080:8080"]
    depends_on: [jb-auth-api, jb-opd-service, jb-lab-service]
    networks: [jb-network]
    restart: unless-stopped

  jb-hospital-ui:
    build: ./jb-hospital-ui
    container_name: jb-hospital-ui
    ports: ["3000:80"]
    depends_on: [jb-gateway]
    networks: [jb-network]
    restart: unless-stopped

networks:
  jb-network:
    driver: bridge

volumes:
  auth_db_data:
  opd_db_data:
  lab_db_data:
